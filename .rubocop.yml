AllCops:
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  NewCops: disable
  Exclude:
    - 'vendor/**/*'
    - '.chef/**/*'
    - 'local-mode-cache/**/*'
    - 'symboliser-vagrant/**/*'

Style/NumericLiterals:
  MinDigits: 6

Style/DoubleNegation:
  Enabled: false

Style/HashSyntax:
  Enabled: false

Style/DateTime:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 2000

Metrics/BlockLength:
  Max: 2000

Metrics/AbcSize:
  Max: 20

Metrics/CyclomaticComplexity:
  Max: 9

Metrics/PerceivedComplexity:
  Max: 9

Metrics/ParameterLists:
  Max: 9

Naming/MethodParameterName:
  MinNameLength: 2

Naming/AccessorMethodName:
  Enabled: false

# RuboCop 1 enables these by default. The existing style is unchanged.
Style/FrozenStringLiteralComment:
  Enabled: false

Style/RedundantBegin:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Style/HashEachMethods:
  Enabled: false

Style/BlockDelimiters:
  Enabled: false

Style/RedundantFileExtensionInRequire:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Lint/UselessMethodDefinition:
  Enabled: false
